name: 同步上游规则

on:
  schedule:
    - cron: "17 20 * * *" # 每天北京时间 04:17
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-rulesets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 合并上游列表
        run: python scripts/build_rulesets.py

      - name: 有变化时提交
        run: |
          if git diff --quiet -- ruleset; then
            echo "上游无变化"
            exit 0
          fi
          git diff --stat -- ruleset
          git config user.name "github-actions[bot]"
          git config user.email "41898273+github-actions[bot]@users.noreply.github.com"
          git add ruleset
          git commit -m "ruleset: 自动同步上游列表"
          git push
